services:
  postgres:
    image: postgres:16-alpine
    container_name: eventcrew-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventcrew
      POSTGRES_PASSWORD: eventcrew_dev_password
      POSTGRES_DB: eventcrew_db
    ports:
      - "5432:5432"
    volumes:
      - eventcrew_pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d

volumes:
  eventcrew_pgdata:
